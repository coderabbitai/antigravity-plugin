name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coderabbitai/skills
          ref: 59945da347a93f9937d3fb09f5ba81a16010351f
          path: .upstream/skills
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: coderabbitai/cursor-plugin
          ref: ec858d6b6b26949e0004d9f41b66be9c5d9321b2
          path: .upstream/cursor
      - run: npm run sync:upstream -- --skills-root .upstream/skills --cursor-root .upstream/cursor --check
