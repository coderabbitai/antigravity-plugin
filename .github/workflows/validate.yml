name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: coderabbitai/skills
          ref: 59945da347a93f9937d3fb09f5ba81a16010351f
          path: .upstream/skills
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: coderabbitai/cursor-plugin
          ref: ec858d6b6b26949e0004d9f41b66be9c5d9321b2
          path: .upstream/cursor
      - run: npm run sync:upstream -- --skills-root .upstream/skills --cursor-root .upstream/cursor --check
